# eventrouter configuration reference. Every key already has the default
# shown, so this whole file is optional. Copy to config.yaml and edit, or
# mount just what you need as a ConfigMap - see deploy/deploy.yaml.

kubeconfig: "" # empty uses the in-cluster service account (env: KUBECONFIG)
enable-prometheus: true # exposes /metrics

log:
  format: json # json, text (env: LOG_FORMAT)
  level: info # debug, info, warn, error (env: LOG_LEVEL)

# sinks is a list, each entry a "type" plus that sink's own settings inline.
# The default is a single stdout sink, which takes no settings of its own.
# Listing the same type more than once configures more than one instance of
# it, each with independent settings - two different HTTP endpoints, say.
sinks:
  - type: stdout

  # Uncomment a block below (keep the indentation) to add or replace it.

  # - type: http # POSTs RFC5424-framed events to an HTTP endpoint
  #   url: https://logs.example.com/ingest # required
  #   bufferSize: 1500 # events buffered before dropping (discardMessages: true) or blocking
  #   discardMessages: true

  # - type: s3sink # batches events and uploads them to an S3 bucket
  #   accessKeyId: AKIAIOSFODNN7EXAMPLE
  #   secretAccessKey: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  #   region: us-east-1
  #   bucket: my-eventrouter-bucket
  #   bucketDir: events
  #   outputFormat: rfc5424 # rfc5424, flatjson
  #   bufferSize: 1500
  #   discardMessages: true
  #   uploadInterval: 120 # seconds between uploads

  # - type: influxdb
  #   host: influxdb.example.com:8086
  #   username: eventrouter
  #   password: changeme
  #   name: k8s
  #   secure: false
  #   withFields: false
  #   insecureSsl: false
  #   retentionPolicy: "0" # a number would be sent as one; InfluxDB wants this as a string
  #   clusterName: default
  #   disableCounterMetrics: false
  #   concurrency: 1

  # - type: filesink # writes one JSON event per line to a local file, rotated
  #   path: /var/log/eventrouter/events.log # required
  #   maxSize: 100 # megabytes before rotating (0 defaults to 100)
  #   maxBackups: 100 # rotated files to keep (0 = unlimited)
  #   maxAge: 366 # days to keep rotated files (0 = unlimited)
  #   compress: true # gzip rotated files
