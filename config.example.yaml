# eventrouter configuration reference. Every key already has the default
# shown, so this whole file is optional. Copy to config.yaml and edit, or
# mount just what you need as a ConfigMap - see deploy/deploy.yaml.

kubeconfig: "" # kubeconfig path; empty uses the in-cluster service account (env: KUBECONFIG)
sink: stdout # which block below is read: stdout, http, s3sink, influxdb
enable-prometheus: true # exposes /metrics
log-format: json # json, text (env: LOG_FORMAT)
log-level: info # debug, info, warn, error (env: LOG_LEVEL)

stdout:
  jsonNamespace: "" # wrap each event as {"<jsonNamespace>": <event>} instead of writing it bare

# Uncomment the block matching `sink` above and fill it in - the rest are
# ignored either way.

# http: # POSTs RFC5424-framed events to an HTTP endpoint
#   url: "" # required
#   bufferSize: 1500 # events buffered before...
#   discardMessages: true # ...dropping (true) or blocking the watch (false)

# s3sink: # batches events and uploads them to an S3 bucket
#   accessKeyId: ""
#   secretAccessKey: ""
#   region: ""
#   bucket: ""
#   bucketDir: ""
#   outputFormat: rfc5424 # rfc5424, flatjson (flatjson suits Redshift-style loaders)
#   bufferSize: 1500
#   discardMessages: true
#   uploadInterval: 120 # seconds between uploads

