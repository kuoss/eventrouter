name: pull-request

on:
  pull_request:

# A PR only needs its latest revision verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here writes to the repository or the registry. Requesting
# write scopes would also make every Dependabot PR fail, since those runs only
# ever get a read-only token.
permissions:
  contents: read

env:
  # Keep in sync with the Makefile.
  GOLANGCI_LINT_VERSION: v2.13.2
  IMAGE: ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
    # Covers gofmt and goimports too - see the formatters in .golangci.yml.
    - uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
    - run: make test-race
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      # A coverage service being down is not a reason to block a PR.
      continue-on-error: true
      with:
        files: coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      continue-on-error: true
      with:
        file: coverage.out
        format: golang

  # Every platform the release builds, so an arch-specific break in the
  # Dockerfile shows up here rather than on a release tag. One runner per
  # platform: these builds are CPU-bound, so building all three on a single
  # runner just splits the same cores three ways (183s each that way, ~90s
  # with a runner to themselves).
  docker-build:
    name: docker-build (${{ matrix.key }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          key: amd64
          scan: true
        - platform: linux/arm64
          key: arm64
          scan: false
        - platform: linux/arm/v7
          key: armv7
          scan: false
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    # Only to run the foreign-architecture image below; the build itself
    # cross-compiles and needs no emulation.
    - uses: docker/setup-qemu-action@v4
      if: matrix.platform != 'linux/amd64'
      with:
        platforms: ${{ matrix.platform }}
    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: false
        load: true
        tags: ${{ env.IMAGE }}
        # No cache-to: the only layer a build cache can reuse here is
        # "go mod download" (the compile is invalidated by any source change),
        # and exporting the cache measured 99.7s against maybe 40s saved.
    # Proves the binary actually runs on the target architecture, which
    # building it does not. The binary is named explicitly because the image
    # sets CMD rather than ENTRYPOINT, so an argument would replace it.
    - name: Run the image
      run: |
        docker run --rm --platform ${{ matrix.platform }} ${{ env.IMAGE }} \
          /app/eventrouter --version
    # Informational only: the vulnerability database changes without the PR
    # changing, so this must not gate the merge. The scheduled security
    # workflow is the one that fails on findings.
    - name: Scan image
      if: matrix.scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}
        scanners: vuln
        format: table
        vuln-type: os,library
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: 0
