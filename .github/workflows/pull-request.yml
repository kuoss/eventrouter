name: pull-request

on:
  pull_request:

# A PR only needs its latest revision verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here writes to the repository or the registry. Requesting
# write scopes would also make every Dependabot PR fail, since those runs only
# ever get a read-only token.
permissions:
  contents: read

env:
  # Keep in sync with the Makefile.
  GOLANGCI_LINT_VERSION: v2.13.2
  IMAGE: ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    # Covers gofmt and goimports too - see the formatters in .golangci.yml.
    - uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: make test-race
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      # A coverage service being down is not a reason to block a PR.
      continue-on-error: true
      with:
        files: coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      continue-on-error: true
      with:
        file: coverage.out
        format: golang

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    # Every platform the release builds, so an arch-specific break in the
    # Dockerfile shows up here rather than on a release tag.
    - name: Build image for every release platform
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
    # Again for amd64 only: --load takes a single platform, and the scan below
    # needs the image in the local daemon. Served from the cache above.
    - name: Load image for scanning
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: ${{ env.IMAGE }}
        cache-from: type=gha
    # Informational only: the vulnerability database changes without the PR
    # changing, so this must not gate the merge. The scheduled security
    # workflow is the one that fails on findings.
    - name: Scan image
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}
        scanners: vuln
        format: table
        vuln-type: os,library
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: 0
