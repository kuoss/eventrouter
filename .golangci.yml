version: "2"

run:
  # Generous enough for a cold cache in CI, low enough to catch a hang.
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocyclo
    - importas
    - misspell
    - unconvert
  settings:
    importas:
      # k8s.io/api/*/v1 packages all share the "v1" package name, so the
      # alias is what keeps a file with more than one of them (or with
      # events.k8s.io/v1) readable.
      no-unaliased: true
      alias:
        - pkg: k8s.io/api/core/v1
          alias: corev1

issues:
  # Report every occurrence instead of the default 3 per message.
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
